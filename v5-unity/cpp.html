<script type="text/javascript">
// 关联标准输入内容与文件名并存储到 localStorage
function getStdinKey() {
  var fname = document.getElementById('cppFileNameInput').value || '';
  return 'cppStdinInput:' + fname;
}

function saveStdinToLocal() {
  var key = getStdinKey();
  var val = document.getElementById('cppStdinInput').value;
  if (key) localStorage.setItem(key, val);
}

function loadStdinFromLocal() {
  var key = getStdinKey();
  var val = localStorage.getItem(key);
  if (val !== null) {
    document.getElementById('cppStdinInput').value = val;
  } else {
    document.getElementById('cppStdinInput').value = '';
  }
}

document.addEventListener('DOMContentLoaded', function() {
  // 页面加载时自动加载标准输入内容
  loadStdinFromLocal();
  // 文件名变动时自动加载对应输入内容
  document.getElementById('cppFileNameInput').addEventListener('input', function() {
    loadStdinFromLocal();
  });
  // 输入内容变动时自动保存
  document.getElementById('cppStdinInput').addEventListener('input', function() {
    saveStdinToLocal();
  });
  // 清理缓存按钮
  var clearBtn = document.getElementById('clearLocalCache');
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      localStorage.clear();
      location.reload();
    });
  }
});
</script>
